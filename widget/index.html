<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>CalVue</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #020706;
        color: #54ff28;
        font-family: Segoe UI, Arial, sans-serif;
        overflow: hidden;
      }

      .widget {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        border: 1px solid rgba(84, 255, 40, 0.35);
        box-sizing: border-box;
        background:
          radial-gradient(circle at top left, rgba(41, 255, 198, 0.18), transparent 40%),
          #020706;
      }

      .logo {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.05em;
        text-shadow: 0 0 18px rgba(84, 255, 40, 0.7);
      }

      .sub {
        margin-top: 6px;
        color: #29ffc6;
        font-size: 12px;
        text-align: center;
        letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <main class="widget">
      <div>
        <div class="logo">CalVue</div>
        <div class="sub">NATIVE TEST</div>
      </div>
    </main>
  </body>
</html>
